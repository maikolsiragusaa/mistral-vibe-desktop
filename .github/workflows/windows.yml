name: Windows build

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: x64

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.10

      - name: Install renderer dependencies
        run: npm ci

      - name: Install pinned official Vibe backend
        shell: pwsh
        run: ./scripts/install-backend.ps1

      - name: Download the Electron runtime
        run: node node_modules/electron/install.js

      - name: Build renderer and run backend tests
        run: |
          npm run build
          npm test

      - name: Freeze and probe the official Vibe app server
        shell: pwsh
        run: ./scripts/build-backend.ps1

      - name: Exercise the desktop against the frozen backend
        shell: pwsh
        run: |
          $env:VIBE_TEST_SERVER = Join-Path $env:GITHUB_WORKSPACE '.runtime/backend/vibe-app-server/vibe-app-server.exe'
          npm run test:ui

      - name: Build the Windows NSIS installer
        run: npm run package

      - name: Exercise the packaged Windows app
        shell: pwsh
        run: |
          $env:VIBE_TEST_DESKTOP = Join-Path $env:GITHUB_WORKSPACE 'out/win-unpacked/Vibe Desktop.exe'
          npm run test:ui

      - name: Verify the installer and write its SHA-256
        id: installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath out -Filter '*Setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer in out; found $($installers.Count)."
          }
          $hash = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path (Get-Location) 'out/SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($checksumPath, "$hash  $($installers[0].Name)`n", [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "sha256=$hash`n", [System.Text.UTF8Encoding]::new($false))
          Write-Host "Installer SHA-256: $hash"

      - name: Upload verified Windows build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vibe-Desktop-Windows-${{ github.sha }}-${{ steps.installer.outputs.sha256 }}
          path: |
            out/*Setup.exe
            out/SHA256SUMS.txt
            docs/screenshots/*.png
            docs/performance/*.json
            .runtime/backend/vibe-app-server/build-metadata.json
            .runtime/backend/vibe-app-server/licenses/manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vibe-Desktop-Diagnostics-${{ github.sha }}
          path: |
            .runtime/ui-failure.png
            .runtime/ui-expansion-failure.png
            .runtime/playwright-results/**
          if-no-files-found: ignore
          retention-days: 7
